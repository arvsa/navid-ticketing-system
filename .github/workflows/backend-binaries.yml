# Builds a GitHub release: static Linux binaries of the backend and the offline
# bundles (instructions/offline-bundle.md) for amd64 and arm64, and the built
# frontend (static files, the same for every platform). Push a tag like
# `v0.0.1`, or run it by hand.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Alpine's Rust targets musl, so the binaries are fully static and run on
      # any Linux, including the debian image in Dockerfile.prebuilt.
      - name: Build
        run: |
          docker run --rm -v "$PWD/backend:/app" -w /app -e SQLX_OFFLINE=true \
            rust:1.95-alpine sh -c '
              apk add --no-cache musl-dev &&
              cargo build --release --bins'

      - name: Package
        run: |
          out=linux-${{ matrix.arch }}
          mkdir "$out"
          # login, logout, whoami and change_password are local-dev helpers: not shipped.
          for bin in backend admin health users; do
            sudo cp "backend/target/release/$bin" "$out/"
          done
          sudo chown -R "$USER" "$out"
          tar -czf "backend-$out.tar.gz" "$out"
          sha256sum "backend-$out.tar.gz" > "backend-$out.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: backend-linux-${{ matrix.arch }}
          path: backend-linux-${{ matrix.arch }}.tar.gz*

  # Static files: build once, serve anywhere. Built as in frontend/Dockerfile.
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          docker run --rm -v "$PWD/frontend:/app" -w /app node:22-alpine sh -c '
            corepack enable &&
            pnpm install --frozen-lockfile &&
            pnpm build'

      # html/ is the site; nginx.conf is the one the image uses (it proxies
      # /api to a host named "backend": point it at yours).
      - name: Package
        run: |
          mkdir frontend-dist
          sudo cp -r frontend/dist frontend-dist/html
          cp frontend/nginx.conf frontend-dist/
          sudo chown -R "$USER" frontend-dist
          tar -czf frontend-dist.tar.gz frontend-dist
          sha256sum frontend-dist.tar.gz > frontend-dist.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist.tar.gz*

  release:
    needs: [build, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "Backend binaries for Linux (amd64, arm64) and the built frontend."
          gh release upload "$TAG" backend-linux-*.tar.gz* frontend-dist.tar.gz* --clobber

  # Runs the same script as a local build, on a runner of each architecture so
  # nothing is emulated. Needs the release created by the job above.
  offline-bundle:
    needs: release
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: ./build-offline-bundle.sh -v "${TAG#v}" ${{ matrix.arch }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" "navid-offline/navid-offline-${TAG#v}-${{ matrix.arch }}.zip" --clobber
