name: navid

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: ticketing
    # Published so `cargo run` and `cargo test` on your machine can use it too.
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./backend
    # Settings come from the root .env (defaults: .env.example). env_file paths
    # resolve next to this file, so running compose from backend/ can't pick up
    # backend/.env (the `cargo run` settings) by mistake.
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://ticketing:ticketing@postgres:5432/ticketing
    volumes:
      - attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Serves the built frontend and proxies /api to the backend (one origin).
  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-8000}:80" # read from the .env where you run compose: run it from the repo root
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  attachments:
