name: navid

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: ticketing
    # Published so `cargo run` and `cargo test` on your machine can use it too.
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://ticketing:ticketing@postgres:5432/ticketing
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RUST_LOG: ${RUST_LOG:-backend=info,tower_http=info,sqlx=warn}
    volumes:
      - attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Serves the built frontend and proxies /api to the backend (one origin).
  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  attachments:
