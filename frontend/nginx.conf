# Used by the Docker image: serves dist/ and proxies /api to the backend.
# Origin is passed through untouched (the backend checks it on non-GET requests).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Uploads need up to 26 MB (backend docs/REFERENCE.md, "Deploying").
    client_max_body_size 26m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    # Live updates (Server-Sent Events): no buffering, long-lived connection.
    location = /api/stream {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Built files have hashed names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes all load index.html.
    location / {
        try_files $uri /index.html;
    }
}
