[workspace]

[package]
name = "backend"
version = "0.1.0"
edition = "2021"
default-run = "backend"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rust_xlsxwriter = "0.100.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "time", "json", "macros", "migrate", "ipnet"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
time-tz = "2.0.0"
tokio = { version = "1.53.3", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "limit", "compression-gzip", "request-id", "timeout", "set-header", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "time"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
calamine = "0.36.1"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }

# Keep dev builds small: file/line info for our code, none for dependencies.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

# Argon2 is unbearably slow unoptimized; keep debug builds and tests snappy.
[profile.dev.package.argon2]
opt-level = 3
